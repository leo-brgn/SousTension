# Nakama local pour le dev (E1-01). Console : http://127.0.0.1:7351 (admin / password : dev uniquement).
# Ne pas utiliser ces identifiants ni cette clé serveur en production.
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "nakama", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    # Pas de port hôte : seul Nakama (réseau Docker interne) accède à la base.

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG --session.token_expiry_sec 7200
        --runtime.js_entrypoint index.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
